<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康紀錄中心 - 衛寶熊</title>
    <style>
        body { background-color: #FFF9E6; font-family: "微軟正黑體", sans-serif; color: #5C4330; margin: 0; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 400px; width: 100%; }
        h2 { text-align: center; color: #6C8E7B; margin-bottom: 5px; font-size: 24px; }
        .subtitle { text-align: center; font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; }
        .card { background-color: #FFFFFF; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.05); width: 100%; box-sizing: border-box; }
        .card-title { font-size: 18px; font-weight: bold; color: #5C4330; margin-bottom: 15px; border-bottom: 1px solid #EEE; padding-bottom: 8px; }
        
        /* 三選單導覽列 */
        .nav-menu { display: flex; justify-content: space-around; background-color: #FFFFFF; padding: 10px; border-radius: 30px; margin-bottom: 20px; box-shadow: 0px 4px 10px rgba(0,0,0,0.05); width: 100%; box-sizing: border-box;}
        .nav-item { text-decoration: none; color: #888; font-size: 13px; font-weight: bold; padding: 6px 12px; }
        .nav-active { color: #6C8E7B; background-color: #E8F0EA; border-radius: 20px; }

        /* 陪伴系統 */
        .mascot-area { text-align: center; margin-bottom: 15px; }
        .mascot-msg { font-size: 13px; color: #6C8E7B; font-weight: bold; background-color: #E8F0EA; padding: 8px 15px; border-radius: 20px; display: inline-block; line-height: 1.4; max-width: 90%; }
        
        /* 數據大型看板 */
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background-color: #FDFBF7; border: 1px solid #E6DBC5; border-radius: 10px; padding: 10px; text-align: center; }
        .stat-value { font-size: 17px; font-weight: bold; color: #6C8E7B; margin-top: 4px; }
        .stat-label { font-size: 11px; color: #888; font-weight: bold; }

        /* 輸入框 */
        .input-block { background-color: #FAF6EE; border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid #E6DBC5; text-align: left; }
        .input-label { font-size: 13px; font-weight: bold; color: #5C4330; display: block; margin-bottom: 5px; }
        .custom-input { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #DDD; font-size: 13px; outline: none; box-sizing: border-box; background-color: #FFFFFF; }
        .hint-text { font-size: 11.5px; margin-top: 5px; line-height: 1.4; color: #666; background-color: #FFF; padding: 6px; border-radius: 6px; border-left: 3px solid #FFB74D; }
        .add-btn { background-color: #6C8E7B; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px;}
        .waist-alert-badge { padding: 12px; border-radius: 10px; font-weight: bold; text-align: left; font-size: 13px; margin-top: 10px; line-height: 1.6;}
        .badge-safe { background-color: #E8F5E9; color: #2E7D32; border: 1px solid #A3C9A8; }
        .badge-warning { background-color: #FFF3E0; color: #D84315; border: 1px solid #FFCC80; }
        .badge-neutral { background-color: #F3F4F6; color: #555; border: 1px solid #CCC; }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="nav-menu">
            <a href="profile-1.html" class="nav-item">👤 個人檔案</a>
            <a href="dashboard-1.html" class="nav-item nav-active">📈 健康紀錄</a>
            <a href="food-1.html" class="nav-item">🥗 食光日記</a>
        </div>

        <div class="mascot-area">
            <img id="mascotFace" src="熊1.png" style="width: 75px; height: 75px; object-fit: contain; border-radius: 50%; margin-bottom: 8px;" onerror="this.src='https://placehold.co/75?text=Bear'">
            <br>
            <div id="mascotMessage" class="mascot-msg">我是衛寶熊🐻 這裡可以自由紀錄你的生理數據，想填哪一格都可以喔！</div>
        </div>

        <h2>📈 個人健康紀錄中心</h2>
        <div class="subtitle">追蹤多元生理數據，溫和陪伴</div>

        <div id="dashboardCore">
            
            <div class="card" style="border: 1px solid #FFD54F; background-color: #FFFDE7;">
                <div class="card-title" style="font-size: 16px; color: #F57F17;">📝 自由登記生理指標 (皆為選填)</div>
                
                <p style="font-size: 12px; color: #888; margin-bottom: 10px;">💡 以下欄位可自由選填，輸入後點擊最下方儲存即可更新對應的紀錄。</p>

                <div class="input-block">
                    <label class="input-label">📏 身高 (cm) / ⚖️ 體重 (kg)</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="inputH" class="custom-input" placeholder="身高">
                        <input type="number" id="inputW" class="custom-input" placeholder="體重">
                    </div>
                </div>

                <div class="input-block">
                    <label class="input-label">⭕ 腰圍 (cm)</label>
                    <input type="number" id="inputWaist" class="custom-input" placeholder="例如: 75">
                </div>
                
                <div class="input-block">
                    <label class="input-label">💓 收縮壓 / 舒張壓 (mmHg)</label>
                    <input type="text" id="inputBP" class="custom-input" placeholder="例如: 120/80">
                </div>
                
                <div class="input-block">
                    <label class="input-label">🔥 估算總熱量(kcal) / 💪 肌肉量(kg)</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="inputCalories" class="custom-input" placeholder="熱量">
                        <input type="number" id="inputMuscle" class="custom-input" placeholder="肌肉量">
                    </div>
                </div>
                
                <div class="input-block">
                    <label class="input-label">📉 脂肪百分比 - 體脂率 (%)</label>
                    <input type="number" id="inputFat" class="custom-input" placeholder="例如: 22.3">
                </div>

                <button class="add-btn" style="background-color: #F57F17;" onclick="saveAdvancedStats()">更新已填寫的紀錄 💾</button>
            </div>

            <div class="card">
                <div class="card-title">📊 當前生理指標總覽</div>
                <div class="grid-stats">
                    <div class="stat-box"><div class="stat-label">📐 身高</div><div id="showHeight" class="stat-value">--</div></div>
                    <div class="stat-box"><div class="stat-label">⚖️ 體重</div><div id="showWeight" class="stat-value">--</div></div>
                    <div class="stat-box"><div class="stat-label">📊 BMI / 腰圍</div><div id="showBMIVals" class="stat-value">--</div></div>
                    <div class="stat-box"><div class="stat-label">💓 歷史血壓</div><div id="showBP" class="stat-value">--</div></div>
                    <div class="stat-box"><div class="stat-label">💪 肌肉量</div><div id="showMuscle" class="stat-value">--</div></div>
                    <div class="stat-box"><div class="stat-label">✨ 體脂率</div><div id="showFat" class="stat-value">--</div></div>
                </div>

                <div id="waistLightBox" class="waist-alert-badge"></div>
            </div>

        </div>
    </div>

    <script>
        window.onload = function() {
            // 直接載入畫面，不再檢查是否建立過檔案
            refreshDashboardView();
        };

        function refreshDashboardView() {
            const name = localStorage.getItem('saved_name') || '同學';
            const h = parseFloat(localStorage.getItem('saved_height'));
            const w = parseFloat(localStorage.getItem('saved_weight'));
            const waist = parseFloat(localStorage.getItem('saved_waist'));
            
            const bp = localStorage.getItem('saved_bp') || '--';
            const muscle = localStorage.getItem('saved_muscle') || '--';
            const fat = localStorage.getItem('saved_fat') || '--';

            document.getElementById('mascotMessage').innerText = `哈囉 ${name}，這裡可以自由管理你的健康軌跡喔！✨`;

            document.getElementById('showHeight').innerText = h ? h + " cm" : "--";
            document.getElementById('showWeight').innerText = w ? w + " kg" : "--";
            
            let bmiText = "--";
            if (h && w) {
                bmiText = (w/((h/100)*(h/100))).toFixed(1);
            }
            document.getElementById('showBMIVals').innerText = `${bmiText} / ${waist ? waist + "cm" : "--"}`;
            
            document.getElementById('showBP').innerText = bp !== '--' ? bp + " mmHg" : "--";
            document.getElementById('showMuscle').innerText = muscle !== '--' ? muscle + " kg" : "--";
            document.getElementById('showFat').innerText = fat !== '--' ? fat + " %" : "--";

            const lightBox = document.getElementById('waistLightBox');
            
            if (h && w && waist) {
                const bmi = w / ((h/100)*(h/100));
                let isWaistHigh = (waist >= 80);
                let isBmiHigh = (bmi >= 24);

                if (!isBmiHigh && !isWaistHigh) {
                    lightBox.className = "waist-alert-badge badge-safe";
                    lightBox.innerHTML = `🟢 <strong>衛寶熊溫和體質判定：</strong><br>當前各項核心防線皆符合標準範圍！建議繼續維持「2:1:1均衡餐盤」與適量喝水，為身體存好充沛體能。`;
                } else if (!isBmiHigh && isWaistHigh) {
                    lightBox.className = "waist-alert-badge badge-warning";
                    lightBox.innerHTML = `🟡 <strong>衛寶熊溫馨小叮嚀：</strong><br>你的腰圍數據提示可能屬於『隱性泡芙體質』。別擔心！我們可以透過在『食光日記』中多夾一格綠色蔬菜、並搭配微幅的「肌力訓練」來幫助新陳代謝喔！`;
                } else {
                    lightBox.className = "waist-alert-badge badge-warning";
                    lightBox.innerHTML = `🟠 <strong>衛寶熊溫和改善指南：</strong><br>為了讓心血管和代謝泵浦能更輕鬆運作，我們建議採取『減法飲食』(如少淋滷汁、去皮)，並配合規律的動態生活，一起溫和地調整體位狀況。`;
                }
            } else {
                lightBox.className = "waist-alert-badge badge-neutral";
                lightBox.innerHTML = `🐻 <strong>衛寶熊：</strong><br>歡迎使用儀表板！你可以隨時在上方更新你想記錄的生理數據，系統會自動幫你彙整在此。`;
            }
        }

        function saveAdvancedStats() {
            const h = document.getElementById('inputH').value.trim();
            const w = document.getElementById('inputW').value.trim();
            const waist = document.getElementById('inputWaist').value.trim();
            const bp = document.getElementById('inputBP').value.trim();
            const cal = document.getElementById('inputCalories').value.trim();
            const muscle = document.getElementById('inputMuscle').value.trim();
            const fat = document.getElementById('inputFat').value.trim();

            let updatedAny = false;

            if(h) { localStorage.setItem('saved_height', h); updatedAny = true; }
            if(w) { localStorage.setItem('saved_weight', w); updatedAny = true; }
            if(waist) { localStorage.setItem('saved_waist', waist); updatedAny = true; }
            if(bp) { localStorage.setItem('saved_bp', bp); updatedAny = true; }
            if(cal) { localStorage.setItem('saved_cal', cal); updatedAny = true; }
            if(muscle) { localStorage.setItem('saved_muscle', muscle); updatedAny = true; }
            if(fat) { localStorage.setItem('saved_fat', fat); updatedAny = true; }

            if(!updatedAny) {
                return alert("你還沒有填寫任何要更新的數據喔！");
            }

            document.getElementById('inputH').value = ''; document.getElementById('inputW').value = '';
            document.getElementById('inputWaist').value = ''; document.getElementById('inputBP').value = '';
            document.getElementById('inputCalories').value = ''; document.getElementById('inputMuscle').value = '';
            document.getElementById('inputFat').value = '';

            refreshDashboardView();
            alert("🐻 衛寶熊：輸入的紀錄已更新成功！");

            sendToBackend();
        }

        // 🌟 這裡已更新為：把畫面上所有的生理數據通通抓出來，送到後台的兩個欄位裡
        function sendToBackend() {
            const id = localStorage.getItem('saved_student_id') || '未綁定';
            const role = localStorage.getItem('saved_role') || '未綁定';
            const name = localStorage.getItem('saved_name') || '未綁定';
            
            const h = localStorage.getItem('saved_height') || '未測';
            const w = localStorage.getItem('saved_weight') || '未測';
            const waist = localStorage.getItem('saved_waist') || '未測';
            const bp = localStorage.getItem('saved_bp') || '未測';
            const cal = localStorage.getItem('saved_cal') || '未測';
            const muscle = localStorage.getItem('saved_muscle') || '未測';
            const fat = localStorage.getItem('saved_fat') || '未測';
            
            let today = new Date();
            const dayNames = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            let currentDayName = dayNames[today.getDay()];

            const googleFormUrl = "https://docs.google.com/forms/d/e/1FAIpQLSeCsJUaZRtzP1ZhRQ83_97oOB2e9VxHb4txav9I5sPvKYqUyg/formResponse";
            const formData = new FormData();
            
            formData.append('entry.1612908578', id);
            formData.append('entry.22380892', role);
            formData.append('entry.639290903', name);
            formData.append('entry.573874726', currentDayName);
            formData.append('entry.2005915541', "自選指標更新");
            
            // 將所有數據打包進表單中
            formData.append('entry.303471113', `身高:${h}cm, 體重:${w}kg, 腰圍:${waist}cm, 體脂:${fat}%`);
            formData.append('entry.1059819279', `血壓:${bp}, 肌肉:${muscle}kg, 熱量:${cal}kcal`);

            fetch(googleFormUrl, { method: 'POST', mode: 'no-cors', body: formData });
        }
    </script>
</body>
</html>
